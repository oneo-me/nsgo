[package]
name = "nsgo-benchmark-nsh"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, apart from any around it.
[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
cases = { path = "../cases" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[profile.release]
strip = true
