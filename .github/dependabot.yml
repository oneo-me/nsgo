# Every third-party action in .github/workflows is pinned to a commit SHA, which nobody updates by hand; Dependabot keeps those pins current. Go modules and the website's Bun packages come as one grouped pull request per ecosystem for minor and patch releases, so a monthly sweep stays reviewable, while each major version arrives on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      website-minor:
        update-types: [minor, patch]
