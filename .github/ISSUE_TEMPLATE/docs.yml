name: Documentation
description: A page that is wrong, unclear or missing.
labels: [documentation, needs triage]
body:
  - type: markdown
    attributes:
      value: Write in any language.
  - type: input
    id: page
    attributes:
      label: Page
      description: Its link, or the topic a missing page should cover.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
