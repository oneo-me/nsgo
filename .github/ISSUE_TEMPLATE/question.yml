name: Question
description: Ask how to do something with NSGo.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Write in any language. Check the [documentation](https://nsgo.dev/docs/) first; if the answer turns out to be a bug or a missing feature, we will relabel the issue.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do and what you have tried.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - macOS
        - iOS
        - tvOS
        - watchOS
        - Windows
        - Linux
        - Web
        - Android
        - Mini programs
        - Every platform
