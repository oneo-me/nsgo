name: Showcase / 作品展示
description: Share an app, library or resource built with NSGo. / 分享用 NSGo 构建的应用、库或资源。
title: "Showcase: "
labels: [showcase]
body:
  - type: input
    id: link
    attributes:
      label: Link / 链接
      description: Its website, repository or store page. / 网站、仓库或商店页面。
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: About it / 介绍
      description: What it does, with screenshots if you like. / 它做什么，可附截图。
    validations:
      required: true
