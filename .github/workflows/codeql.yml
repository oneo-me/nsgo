name: CodeQL

# Static analysis of the Go code, the website's and the TSX runtime's JavaScript and TypeScript, and the workflows themselves. Like test.yml it runs only when dispatched until the first release (AGENTS.md); restore the push, pull_request and schedule triggers as part of releasing. Whether its results block a merge is a ruleset's decision, not this file's.
on:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - "**/*.md"
  #     - docs/**
  # pull_request:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - "**/*.md"
  #     - docs/**
  # schedule:
  #   - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  # Only a pull request's newer push makes an older scan pointless; a scan of main is the branch's record and finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go has no buildless mode: autobuild compiles the module for Linux, which needs no cgo or system libraries, as the backends reach the system through purego.
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
