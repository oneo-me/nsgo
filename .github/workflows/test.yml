name: Test

# Automatic runs are temporarily disabled: restore the push and pull_request triggers to run again.
on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install GTK 4 and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb
      - name: Vet
        run: go tool nsgo check
      - name: Test
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test

  apple:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Vet
        run: go tool nsgo check ./internal/platform/apple
      - name: Test
        run: go tool nsgo test ./internal/platform/apple
