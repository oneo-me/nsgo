name: Hello
id: dev.oneo.nsgo.hello
version: 0.1.0

# The App Clip a link opens, such as https://hello.example.com/?name=Ada:
# its own package, nested in the iOS package.
app_clip:
  main: ./clip
  domains: [hello.example.com]

dev:
  target: native

build:
  output: dist
  targets: [all, miniprogram]

