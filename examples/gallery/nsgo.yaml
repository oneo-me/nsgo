name: Gallery
id: dev.oneo.nsgo.gallery
version: 0.1.0

dev:
  target: native

widgets:
  - kind: activity
    name: Activity
    description: The day's steps toward a goal, in every size.
    families: [small, medium, large, extra_large, circular, rectangular, inline]
  - kind: photo
    name: Photo
    description: The date over a picture the gallery draws.
    families: [small, medium, large, extra_large]

live_activities:
  enabled: true

build:
  output: dist
  open: true
  targets: [all]

apple:
  info:
    NSMicrophoneUsageDescription: The System page dictates what you say.
    NSSpeechRecognitionUsageDescription: The System page turns what you say into text.
    NSCameraUsageDescription: The System page takes a photo with the camera.
    NSFaceIDUsageDescription: The System page asks for Face ID to show the prompt.

android:
  permissions: [POST_NOTIFICATIONS, USE_BIOMETRIC]
